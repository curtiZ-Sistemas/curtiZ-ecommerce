name: Native PostgreSQL 17 clients
description: Install native clients from the official signed PostgreSQL repository.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        printf '%s\n' \
          'Types: deb' \
          'URIs: https://apt.postgresql.org/pub/repos/apt' \
          'Suites: noble-pgdg' \
          'Components: main' \
          'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
          | sudo tee /etc/apt/sources.list.d/curtiz-pgdg.sources > /dev/null
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y postgresql-client-17 gnupg

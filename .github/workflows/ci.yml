name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      PANEL_DEPLOYMENT_MODE: separate
      NEXT_PUBLIC_STORE_URL: https://store.example.invalid
      NEXT_PUBLIC_PANEL_URL: https://panel.example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      SUPABASE_SECRET_KEY: ci-secret-placeholder
      PAYMENT_PROVIDER: mercadopago
      MERCADO_PAGO_ACCESS_TOKEN: ci-access-placeholder
      MERCADO_PAGO_PUBLIC_KEY: ci-public-placeholder
      MERCADO_PAGO_WEBHOOK_SECRET: ci-webhook-placeholder
      EMAIL_PROVIDER: resend
      EMAIL_FROM: curti Z <noreply@store.example.invalid>
      RESEND_API_KEY: ci-resend-placeholder
      SHIPPING_PROVIDER: custom
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-placeholder
      TURNSTILE_SECRET_KEY: ci-turnstile-placeholder
      PII_ENCRYPTION_KEY: ci-pii-placeholder
      AUDIT_HASH_KEY: ci-audit-placeholder
      ALLOWED_ORIGINS: https://store.example.invalid,https://panel.example.invalid
      AUTH_COOKIE_DOMAIN: example.invalid
      DEMO_MODE: "false"
      REQUIRE_INTERNAL_MFA: "true"
      AUTH_RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - run: supabase start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DEMO_MODE: "true"
      DEMO_USERS_PASSWORD: "1234567890"
      DEMO_SESSION_SECRET: "ci-demo-session-secret-with-at-least-32-characters"
      NEXT_PUBLIC_STORE_URL: http://localhost:3000
      NEXT_PUBLIC_PANEL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

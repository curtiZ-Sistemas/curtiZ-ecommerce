name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Aplicação que deve ser reconstruída e republicada
        required: true
        default: both
        type: choice
        options:
          - both
          - store
          - panel

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  APP_ENV: production
  PANEL_DEPLOYMENT_MODE: separate
  DEMO_MODE: "false"
  CHECKOUT_ENABLED: "false"
  PAYMENT_PROVIDER: disabled
  MERCADO_PAGO_ENABLED: "false"
  MERCADO_PAGO_ENVIRONMENT: test
  SHIPPING_PROVIDER: disabled
  MELHOR_ENVIO_ENABLED: "false"
  MELHOR_ENVIO_ENVIRONMENT: ${{ vars.MELHOR_ENVIO_ENVIRONMENT || 'sandbox' }}
  MELHOR_ENVIO_BASE_URL: ${{ vars.MELHOR_ENVIO_BASE_URL }}
  MELHOR_ENVIO_REDIRECT_URI: ${{ vars.MELHOR_ENVIO_REDIRECT_URI }}
  MELHOR_ENVIO_CLIENT_ID: ${{ vars.MELHOR_ENVIO_CLIENT_ID }}
  MELHOR_ENVIO_APP_NAME: ${{ vars.MELHOR_ENVIO_APP_NAME }}
  MELHOR_ENVIO_TECHNICAL_CONTACT: ${{ vars.MELHOR_ENVIO_TECHNICAL_CONTACT }}
  MELHOR_ENVIO_WEBHOOK_CONFIGURED: ${{ vars.MELHOR_ENVIO_WEBHOOK_CONFIGURED || 'false' }}
  MELHOR_ENVIO_ORIGIN_NAME: ${{ vars.MELHOR_ENVIO_ORIGIN_NAME }}
  MELHOR_ENVIO_ORIGIN_EMAIL: ${{ vars.MELHOR_ENVIO_ORIGIN_EMAIL }}
  MELHOR_ENVIO_ORIGIN_PHONE: ${{ vars.MELHOR_ENVIO_ORIGIN_PHONE }}
  MELHOR_ENVIO_ORIGIN_STATE_REGISTER: ${{ vars.MELHOR_ENVIO_ORIGIN_STATE_REGISTER }}
  MELHOR_ENVIO_ORIGIN_CNAE: ${{ vars.MELHOR_ENVIO_ORIGIN_CNAE }}
  MELHOR_ENVIO_ORIGIN_ADDRESS: ${{ vars.MELHOR_ENVIO_ORIGIN_ADDRESS }}
  MELHOR_ENVIO_ORIGIN_NUMBER: ${{ vars.MELHOR_ENVIO_ORIGIN_NUMBER }}
  MELHOR_ENVIO_ORIGIN_COMPLEMENT: ${{ vars.MELHOR_ENVIO_ORIGIN_COMPLEMENT }}
  MELHOR_ENVIO_ORIGIN_DISTRICT: ${{ vars.MELHOR_ENVIO_ORIGIN_DISTRICT }}
  MELHOR_ENVIO_ORIGIN_CITY: ${{ vars.MELHOR_ENVIO_ORIGIN_CITY }}
  MELHOR_ENVIO_ORIGIN_STATE: ${{ vars.MELHOR_ENVIO_ORIGIN_STATE }}
  MELHOR_ENVIO_ORIGIN_POSTAL_CODE: ${{ vars.MELHOR_ENVIO_ORIGIN_POSTAL_CODE }}
  EMAIL_PROVIDER: disabled
  EMAIL_ENABLED: "false"
  TURNSTILE_ENABLED: "false"
  REQUIRE_INTERNAL_MFA: "false"
  AUTH_RATE_LIMIT_ENABLED: "true"

jobs:
  security:
    name: Segurança
    uses: ./.github/workflows/security.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    permissions:
      contents: read
      security-events: write

  changes:
    name: Detectar aplicações alteradas
    runs-on: ubuntu-latest
    outputs:
      store: ${{ steps.scope.outputs.store }}
      panel: ${{ steps.scope.outputs.panel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        name: Calcular escopo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "::error::O deploy manual de produção só pode partir do branch main."
              exit 1
            fi
            [[ "$MANUAL_TARGET" == "store" || "$MANUAL_TARGET" == "both" ]] && store=true || store=false
            [[ "$MANUAL_TARGET" == "panel" || "$MANUAL_TARGET" == "both" ]] && panel=true || panel=false
          else
            comparison_sha="$BEFORE_SHA"
            [[ "$EVENT_NAME" == "pull_request" ]] && comparison_sha="$BASE_SHA"
            if [[ -z "$comparison_sha" || "$comparison_sha" =~ ^0+$ ]]; then
              comparison_sha="${HEAD_SHA}^"
            fi
            git cat-file -e "${comparison_sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$comparison_sha"
            git diff --name-only "$comparison_sha" "$HEAD_SHA" > changed-files.txt
            store=false
            panel=false
            while IFS= read -r file; do
              case "$file" in
                apps/store/*) store=true ;;
                apps/panel/*) panel=true ;;
                packages/*|scripts/*|supabase/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|tsconfig.json|eslint.config.mjs|.github/workflows/ci.yml)
                  store=true
                  panel=true
                  ;;
              esac
            done < changed-files.txt
          fi
          echo "store=$store" >> "$GITHUB_OUTPUT"
          echo "panel=$panel" >> "$GITHUB_OUTPUT"

  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STORE_URL: https://store.example.invalid
      NEXT_PUBLIC_PANEL_URL: https://panel.example.invalid
      NEXT_PUBLIC_STORE_TEST_URL: https://store-test.example.invalid
      NEXT_PUBLIC_PANEL_TEST_URL: https://panel-test.example.invalid
      SUPABASE_URL: https://project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      SUPABASE_SECRET_KEY: ci-secret-placeholder
      ACCOUNT_DELETION_HMAC_KEY: ci-account-deletion-key-with-at-least-32-characters
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-placeholder
      TURNSTILE_SECRET_KEY: ci-turnstile-placeholder
      PII_ENCRYPTION_KEY: ci-pii-placeholder
      AUDIT_HASH_KEY: ci-audit-placeholder
      RATE_LIMIT_HMAC_KEY: ci-rate-limit-placeholder-with-32-characters
      REFERRAL_ATTRIBUTION_HMAC_KEY: ci-referral-placeholder-with-32-characters
      ALLOWED_ORIGINS: https://store.example.invalid,https://panel.example.invalid,https://store-test.example.invalid,https://panel-test.example.invalid
      AUTH_COOKIE_DOMAINS: example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:exposure
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Banco e migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - run: supabase start
      - run: supabase db lint --local --fail-on error
      - run: supabase test db

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DEMO_MODE: "true"
      DEMO_USERS_PASSWORD: "1234567890"
      DEMO_SESSION_SECRET: "ci-demo-session-secret-with-at-least-32-characters"
      NEXT_PUBLIC_STORE_URL: http://localhost:3000
      NEXT_PUBLIC_PANEL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Executar suíte E2E sem aceitar flaky
        run: pnpm exec playwright test --fail-on-flaky-tests
      - name: Repetir fluxos críticos da loja
        run: >-
          pnpm exec playwright test
          --project=store-desktop
          --project=store-mobile
          --grep "normaliza o cadastro|navega da home|gerencia a remoção"
          --repeat-each=2
          --workers=2
          --fail-on-flaky-tests

  store-worker:
    name: OpenNext / Loja
    needs: [changes, quality, database, e2e, security]
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: store
      PANEL_DEPLOYMENT_MODE: separate
      DEMO_MODE: ${{ github.event_name == 'pull_request' && 'false' || vars.DEMO_MODE }}
      CHECKOUT_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.CHECKOUT_ENABLED }}
      PAYMENT_PROVIDER: ${{ github.event_name == 'pull_request' && 'disabled' || vars.PAYMENT_PROVIDER }}
      MERCADO_PAGO_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.MERCADO_PAGO_ENABLED }}
      SHIPPING_PROVIDER: ${{ github.event_name == 'pull_request' && 'disabled' || vars.SHIPPING_PROVIDER }}
      MELHOR_ENVIO_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.MELHOR_ENVIO_ENABLED }}
      EMAIL_PROVIDER: ${{ github.event_name == 'pull_request' && 'disabled' || vars.EMAIL_PROVIDER }}
      EMAIL_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.EMAIL_ENABLED }}
      EMAIL_FROM: ${{ github.event_name != 'pull_request' && vars.EMAIL_FROM || '' }}
      TURNSTILE_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.TURNSTILE_ENABLED }}
      REQUIRE_INTERNAL_MFA: ${{ github.event_name == 'pull_request' && 'false' || vars.REQUIRE_INTERNAL_MFA }}
      AUTH_RATE_LIMIT_ENABLED: ${{ github.event_name == 'pull_request' && 'true' || vars.AUTH_RATE_LIMIT_ENABLED }}
      ALLOWED_ORIGINS: ${{ github.event_name == 'pull_request' && 'https://store.example.invalid,https://panel.example.invalid,https://store-test.example.invalid,https://panel-test.example.invalid' || vars.ALLOWED_ORIGINS }}
      AUTH_COOKIE_DOMAINS: ${{ github.event_name == 'pull_request' && 'example.invalid' || vars.AUTH_COOKIE_DOMAINS }}
      NEXT_PUBLIC_STORE_URL: ${{ github.event_name == 'pull_request' && 'https://store.example.invalid' || vars.NEXT_PUBLIC_STORE_URL }}
      NEXT_PUBLIC_PANEL_URL: ${{ github.event_name == 'pull_request' && 'https://panel.example.invalid' || vars.NEXT_PUBLIC_PANEL_URL }}
      NEXT_PUBLIC_STORE_TEST_URL: ${{ github.event_name == 'pull_request' && 'https://store-test.example.invalid' || vars.NEXT_PUBLIC_STORE_TEST_URL }}
      NEXT_PUBLIC_PANEL_TEST_URL: ${{ github.event_name == 'pull_request' && 'https://panel-test.example.invalid' || vars.NEXT_PUBLIC_PANEL_TEST_URL }}
      SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://project.supabase.co' || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'ci-publishable-placeholder' || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ github.event_name != 'pull_request' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}
      NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY: ${{ github.event_name == 'pull_request' && 'TEST-ci-public-key' || vars.NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY }}
      SUPABASE_SECRET_KEY: ${{ github.event_name == 'pull_request' && 'ci-secret-placeholder' || '' }}
      ACCOUNT_DELETION_HMAC_KEY: ${{ github.event_name == 'pull_request' && 'ci-account-deletion-key-with-at-least-32-characters' || '' }}
      PII_ENCRYPTION_KEY: ${{ github.event_name == 'pull_request' && 'ci-pii-placeholder-with-at-least-32-characters' || '' }}
      AUDIT_HASH_KEY: ${{ github.event_name == 'pull_request' && 'ci-audit-placeholder' || '' }}
      RATE_LIMIT_HMAC_KEY: ${{ github.event_name == 'pull_request' && 'ci-rate-limit-placeholder-with-32-characters' || '' }}
      REFERRAL_ATTRIBUTION_HMAC_KEY: ${{ github.event_name == 'pull_request' && 'ci-referral-placeholder-with-32-characters' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar secrets de runtime no Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure as credenciais de deploy do Cloudflare."
            exit 1
          fi
          pnpm exec wrangler secret list --config apps/store/wrangler.jsonc --env production --format json > "$RUNNER_TEMP/store-worker-secrets.json"
          pnpm exec tsx scripts/cloudflare-secret-validation.ts "$RUNNER_TEMP/store-worker-secrets.json"
      - name: Validar migration obrigatória no Supabase remoto
        if: github.event_name != 'pull_request'
        run: pnpm exec tsx scripts/validate-supabase-readiness.ts
      - name: Validar produção e compilar Worker da loja
        run: pnpm build:worker
      - name: Publicar curtiz-ecommerce
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório."
            exit 1
          fi
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm exec wrangler deploy --config apps/store/wrangler.jsonc --env production --keep-vars \
            --var "GIT_COMMIT_SHA:${GITHUB_SHA}" \
            --var "BUILD_ID:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --var "BUILD_TIMESTAMP:${build_timestamp}" \
            --var "APP_ENV:${APP_ENV}" \
            --var "MERCADO_PAGO_ENVIRONMENT:${MERCADO_PAGO_ENVIRONMENT}" \
            --var "PANEL_DEPLOYMENT_MODE:${PANEL_DEPLOYMENT_MODE}" \
            --var "DEMO_MODE:${DEMO_MODE}" \
            --var "CHECKOUT_ENABLED:${CHECKOUT_ENABLED}" \
            --var "PAYMENT_PROVIDER:${PAYMENT_PROVIDER}" \
            --var "MERCADO_PAGO_ENABLED:${MERCADO_PAGO_ENABLED}" \
            --var "SHIPPING_PROVIDER:${SHIPPING_PROVIDER}" \
            --var "MELHOR_ENVIO_ENABLED:${MELHOR_ENVIO_ENABLED}" \
            --var "MELHOR_ENVIO_ENVIRONMENT:${MELHOR_ENVIO_ENVIRONMENT}" \
            --var "MELHOR_ENVIO_BASE_URL:${MELHOR_ENVIO_BASE_URL}" \
            --var "MELHOR_ENVIO_REDIRECT_URI:${MELHOR_ENVIO_REDIRECT_URI}" \
            --var "MELHOR_ENVIO_CLIENT_ID:${MELHOR_ENVIO_CLIENT_ID}" \
            --var "MELHOR_ENVIO_APP_NAME:${MELHOR_ENVIO_APP_NAME}" \
            --var "MELHOR_ENVIO_TECHNICAL_CONTACT:${MELHOR_ENVIO_TECHNICAL_CONTACT}" \
            --var "MELHOR_ENVIO_WEBHOOK_CONFIGURED:${MELHOR_ENVIO_WEBHOOK_CONFIGURED}" \
            --var "MELHOR_ENVIO_ORIGIN_NAME:${MELHOR_ENVIO_ORIGIN_NAME}" \
            --var "MELHOR_ENVIO_ORIGIN_EMAIL:${MELHOR_ENVIO_ORIGIN_EMAIL}" \
            --var "MELHOR_ENVIO_ORIGIN_PHONE:${MELHOR_ENVIO_ORIGIN_PHONE}" \
            --var "MELHOR_ENVIO_ORIGIN_STATE_REGISTER:${MELHOR_ENVIO_ORIGIN_STATE_REGISTER}" \
            --var "MELHOR_ENVIO_ORIGIN_CNAE:${MELHOR_ENVIO_ORIGIN_CNAE}" \
            --var "MELHOR_ENVIO_ORIGIN_ADDRESS:${MELHOR_ENVIO_ORIGIN_ADDRESS}" \
            --var "MELHOR_ENVIO_ORIGIN_NUMBER:${MELHOR_ENVIO_ORIGIN_NUMBER}" \
            --var "MELHOR_ENVIO_ORIGIN_COMPLEMENT:${MELHOR_ENVIO_ORIGIN_COMPLEMENT}" \
            --var "MELHOR_ENVIO_ORIGIN_DISTRICT:${MELHOR_ENVIO_ORIGIN_DISTRICT}" \
            --var "MELHOR_ENVIO_ORIGIN_CITY:${MELHOR_ENVIO_ORIGIN_CITY}" \
            --var "MELHOR_ENVIO_ORIGIN_STATE:${MELHOR_ENVIO_ORIGIN_STATE}" \
            --var "MELHOR_ENVIO_ORIGIN_POSTAL_CODE:${MELHOR_ENVIO_ORIGIN_POSTAL_CODE}" \
            --var "EMAIL_PROVIDER:${EMAIL_PROVIDER}" \
            --var "EMAIL_ENABLED:${EMAIL_ENABLED}" \
            --var "EMAIL_FROM:${EMAIL_FROM}" \
            --var "TURNSTILE_ENABLED:${TURNSTILE_ENABLED}" \
            --var "REQUIRE_INTERNAL_MFA:${REQUIRE_INTERNAL_MFA}" \
            --var "AUTH_RATE_LIMIT_ENABLED:${AUTH_RATE_LIMIT_ENABLED}" \
            --var "ALLOWED_ORIGINS:${ALLOWED_ORIGINS}" \
            --var "AUTH_COOKIE_DOMAINS:${AUTH_COOKIE_DOMAINS}" \
            --var "NEXT_PUBLIC_STORE_URL:${NEXT_PUBLIC_STORE_URL}" \
            --var "NEXT_PUBLIC_PANEL_URL:${NEXT_PUBLIC_PANEL_URL}" \
            --var "NEXT_PUBLIC_STORE_TEST_URL:${NEXT_PUBLIC_STORE_TEST_URL}" \
            --var "NEXT_PUBLIC_PANEL_TEST_URL:${NEXT_PUBLIC_PANEL_TEST_URL}" \
            --var "SUPABASE_URL:${SUPABASE_URL}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}" \
            --var "NEXT_PUBLIC_TURNSTILE_SITE_KEY:${NEXT_PUBLIC_TURNSTILE_SITE_KEY}" \
            --var "NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY:${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY}"
      - name: Smoke test pós-deploy sem cobrança
        if: github.event_name != 'pull_request'
        run: pnpm smoke:storefront -- "$NEXT_PUBLIC_STORE_TEST_URL"

  panel-worker:
    name: OpenNext / Painel
    needs: [changes, quality, database, e2e, security]
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: panel
      PANEL_DEPLOYMENT_MODE: separate
      DEMO_MODE: "false"
      CHECKOUT_ENABLED: "false"
      PAYMENT_PROVIDER: disabled
      MERCADO_PAGO_ENABLED: "false"
      SHIPPING_PROVIDER: ${{ github.event_name == 'pull_request' && 'disabled' || vars.SHIPPING_PROVIDER }}
      MELHOR_ENVIO_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.MELHOR_ENVIO_ENABLED }}
      EMAIL_PROVIDER: disabled
      EMAIL_ENABLED: "false"
      TURNSTILE_ENABLED: "false"
      REQUIRE_INTERNAL_MFA: ${{ github.event_name == 'pull_request' && 'false' || vars.REQUIRE_INTERNAL_MFA }}
      AUTH_RATE_LIMIT_ENABLED: ${{ github.event_name == 'pull_request' && 'true' || vars.AUTH_RATE_LIMIT_ENABLED }}
      ALLOWED_ORIGINS: ${{ github.event_name == 'pull_request' && 'https://store.example.invalid,https://panel.example.invalid,https://store-test.example.invalid,https://panel-test.example.invalid' || vars.ALLOWED_ORIGINS }}
      AUTH_COOKIE_DOMAINS: ${{ github.event_name == 'pull_request' && 'example.invalid' || vars.AUTH_COOKIE_DOMAINS }}
      NEXT_PUBLIC_STORE_URL: ${{ github.event_name == 'pull_request' && 'https://store.example.invalid' || vars.NEXT_PUBLIC_STORE_URL }}
      NEXT_PUBLIC_PANEL_URL: ${{ github.event_name == 'pull_request' && 'https://panel.example.invalid' || vars.NEXT_PUBLIC_PANEL_URL }}
      NEXT_PUBLIC_STORE_TEST_URL: ${{ github.event_name == 'pull_request' && 'https://store-test.example.invalid' || vars.NEXT_PUBLIC_STORE_TEST_URL }}
      NEXT_PUBLIC_PANEL_TEST_URL: ${{ github.event_name == 'pull_request' && 'https://panel-test.example.invalid' || vars.NEXT_PUBLIC_PANEL_TEST_URL }}
      SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://project.supabase.co' || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'ci-publishable-placeholder' || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ github.event_name != 'pull_request' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}
      NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY: ${{ github.event_name == 'pull_request' && 'TEST-ci-public-key' || vars.NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY }}
      SUPABASE_SECRET_KEY: ${{ github.event_name == 'pull_request' && 'ci-secret-placeholder' || '' }}
      ACCOUNT_DELETION_HMAC_KEY: ci-account-deletion-key-with-at-least-32-characters
      PII_ENCRYPTION_KEY: ${{ github.event_name == 'pull_request' && 'ci-pii-placeholder-with-at-least-32-characters' || '' }}
      AUDIT_HASH_KEY: ${{ github.event_name == 'pull_request' && 'ci-audit-placeholder' || '' }}
      RATE_LIMIT_HMAC_KEY: ci-rate-limit-placeholder-with-32-characters
      REFERRAL_ATTRIBUTION_HMAC_KEY: ci-referral-placeholder-with-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar secrets de runtime no Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure as credenciais de deploy do Cloudflare."
            exit 1
          fi
          pnpm exec wrangler secret list --config apps/panel/wrangler.jsonc --env production --format json > "$RUNNER_TEMP/panel-worker-secrets.json"
          pnpm exec tsx scripts/cloudflare-secret-validation.ts "$RUNNER_TEMP/panel-worker-secrets.json"
      - name: Validar produção e compilar Worker do painel
        run: pnpm build:worker:panel
      - name: Publicar curtiz-panel
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório."
            exit 1
          fi
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm exec wrangler deploy --config apps/panel/wrangler.jsonc --env production --keep-vars \
            --var "GIT_COMMIT_SHA:${GITHUB_SHA}" \
            --var "BUILD_ID:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
